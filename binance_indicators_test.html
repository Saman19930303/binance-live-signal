<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Binance Indicators Test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0e11;color:#eaecef;font-family:Arial,sans-serif}
.w{max-width:720px;margin:auto;padding:18px}.card{background:#181a20;border:1px solid #2b3139;border-radius:16px;padding:16px;margin:12px 0}
h1{font-size:23px}.status{font-size:14px;color:#848e9c}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#f6465d}.live{background:#0ecb81}
.price{font-size:34px;font-weight:900;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.m{background:#111318;border-radius:12px;padding:12px}.l{font-size:12px;color:#848e9c;margin-bottom:6px}.v{font-size:17px;font-weight:800}
.ok{color:#0ecb81}.bad{color:#f6465d}
</style></head><body><div class="w">
<h1>Binance Live Indicators Test</h1><div class="status"><span id="dot" class="dot"></span> <span id="status">Starting...</span></div>
<div class="card"><div class="l">BTC/USDT LIVE PRICE</div><div id="price" class="price">--</div></div>
<div class="card"><div class="grid">
<div class="m"><div class="l">RSI 14 • 1m</div><div id="rsi" class="v">--</div></div>
<div class="m"><div class="l">EMA 9 • 1m</div><div id="e9" class="v">--</div></div>
<div class="m"><div class="l">EMA 21 • 1m</div><div id="e21" class="v">--</div></div>
<div class="m"><div class="l">MACD Histogram • 1m</div><div id="macd" class="v">--</div></div>
<div class="m"><div class="l">Volume vs 20m Avg</div><div id="vol" class="v">--</div></div>
<div class="m"><div class="l">5m EMA Trend</div><div id="trend" class="v">--</div></div>
<div class="m"><div class="l">1m Candles</div><div id="c1" class="v">--</div></div>
<div class="m"><div class="l">5m Candles</div><div id="c5" class="v">--</div></div>
</div></div>
<div class="card"><div class="l">Status</div><div id="log" class="status">Loading...</div></div>
</div>
<script>
const $=x=>document.getElementById(x);let a1=[],a5=[];
function fmt(n,d=2){return Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})}
function ema(v,p){if(v.length<p)return null;let e=v.slice(0,p).reduce((a,b)=>a+b,0)/p,k=2/(p+1);for(let i=p;i<v.length;i++)e=v[i]*k+e*(1-k);return e}
function es(v,p){if(v.length<p)return[];let e=v.slice(0,p).reduce((a,b)=>a+b,0)/p,k=2/(p+1),o=[e];for(let i=p;i<v.length;i++){e=v[i]*k+e*(1-k);o.push(e)}return o}
function rsi(v,p=14){if(v.length<=p)return null;let gains=[],losses=[];for(let i=1;i<v.length;i++){let d=v[i]-v[i-1];gains.push(Math.max(d,0));losses.push(Math.max(-d,0))}
 let ag=gains.slice(0,p).reduce((a,b)=>a+b,0)/p,al=losses.slice(0,p).reduce((a,b)=>a+b,0)/p;
 for(let i=p;i<gains.length;i++){ag=(ag*(p-1)+gains[i])/p;al=(al*(p-1)+losses[i])/p}
 if(al===0)return 100;return 100-(100/(1+ag/al))}
function macd(v){let f=es(v,12),s=es(v,26);if(!f.length||!s.length)return null;let off=f.length-s.length,line=s.map((x,i)=>f[i+off]-x),sig=ema(line,9);return sig==null?null:line.at(-1)-sig}
async function klines(i){let r=await fetch(`https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=${i}&limit=120`,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);return await r.json()}
function calc(){
 let c=a1.map(x=>+x[4]),v=a1.map(x=>+x[5]),c5=a5.map(x=>+x[4]); if(c.length<40)return;
 let E9=ema(c,9),E21=ema(c,21),R=rsi(c),M=macd(c),avg=v.slice(-21,-1).reduce((a,b)=>a+b,0)/20,vr=avg?v.at(-1)/avg:0;
 let f5=ema(c5,9),s5=ema(c5,21),tr=f5>s5?"UP ↑":"DOWN ↓";
 $("rsi").textContent=R.toFixed(2);$("e9").textContent="$"+fmt(E9);$("e21").textContent="$"+fmt(E21);$("macd").textContent=M.toFixed(4);
 $("vol").textContent=vr.toFixed(2)+"x";$("trend").textContent=tr;$("c1").textContent=a1.length+" ✓";$("c5").textContent=a5.length+" ✓";
 $("log").innerHTML='<span class="ok">Indicators calculated from live Binance candle data ✓</span>';
}
async function start(){try{[a1,a5]=await Promise.all([klines("1m"),klines("5m")]);calc();let ws=new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@trade");
 ws.onmessage=e=>{let d=JSON.parse(e.data);$("price").textContent="$"+fmt(+d.p);$("dot").classList.add("live");$("status").textContent="LIVE • Binance"};
 ws.onerror=()=>{$("log").innerHTML='<span class="bad">WebSocket error</span>'};
 setInterval(async()=>{try{[a1,a5]=await Promise.all([klines("1m"),klines("5m")]);calc()}catch(e){}},5000);
}catch(e){$("log").innerHTML='<span class="bad">'+e.message+'</span>'}}
start();
</script></body></html>
