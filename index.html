<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <title>Pudding Business Pro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }
    .app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      background: #f9fafb;
      padding-bottom: 86px;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #111827;
      color: white;
      padding: 16px 18px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
    }
    .topbar h1 { margin: 0; font-size: 20px; }
    .topbar p { margin: 5px 0 0; color: #d1d5db; font-size: 12px; }

    .page { display: none; padding: 16px; }
    .page.active { display: block; }

    .grid3 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      background: white;
      border-radius: 16px;
      padding: 14px 10px;
      box-shadow: 0 3px 14px rgba(0,0,0,.06);
      min-height: 94px;
    }
    .stat .label { font-size: 11px; color: #6b7280; }
    .stat .value { font-size: 18px; font-weight: 700; margin-top: 8px; line-height: 1.2; }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 3px 14px rgba(0,0,0,.06);
    }
    .card h2, .card h3 { margin-top: 0; }
    .section-title { font-size: 18px; margin: 0 0 12px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin: 12px 0 6px;
      color: #374151;
    }
    input, select {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: white;
      font-size: 15px;
      outline: none;
    }
    input:focus, select:focus { border-color: #111827; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn-primary { background: #111827; color: white; }
    .btn-green { background: #059669; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .btn-light { background: #e5e7eb; color: #111827; }

    .list { display: grid; gap: 10px; }
    .item {
      border: 1px solid #e5e7eb;
      border-radius: 13px;
      padding: 12px;
      background: #fff;
    }
    .item-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .item-title { font-weight: 700; }
    .muted { color: #6b7280; font-size: 12px; }
    .amount { font-weight: 800; }
    .danger { color: #dc2626; }
    .success { color: #059669; }
    .pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #f3f4f6;
      font-size: 11px;
      margin-top: 5px;
    }
    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 22px 10px;
      font-size: 13px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: white;
      border-top: 1px solid #e5e7eb;
      z-index: 30;
    }
    .nav-btn {
      background: white;
      border: 0;
      padding: 10px 3px 8px;
      font-size: 10px;
      color: #6b7280;
      cursor: pointer;
    }
    .nav-btn b {
      display: block;
      font-size: 19px;
      margin-bottom: 3px;
    }
    .nav-btn.active { color: #111827; font-weight: 700; }

    .mini-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .mini-btn {
      border: 0;
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 11px;
      cursor: pointer;
    }
    .mini-delete { background: #fee2e2; color: #991b1b; }

    .balance-banner {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    @media (max-width: 390px) {
      .grid3 { grid-template-columns: 1fr; }
      .stat { min-height: auto; }
    }
  </style>
</head>

<body>
<div class="app">
  <header class="topbar">
    <h1>🍮 Pudding Business Pro</h1>
    <p>Products, Payments & Expense Manager</p>
  </header>

  <!-- Dashboard -->
  <section class="page active" id="dashboard">
    <div class="grid3">
<div class="stat">
        <div class="label">Today Payments</div>
        <div class="value" id="todayPayments">Rs. 0.00</div>
      </div>
<div class="stat">
        <div class="label">Today Expenses</div>
        <div class="value danger" id="todayExpenses">Rs. 0.00</div>
      </div>
      <div class="stat">
        <div class="label">Net Cash</div>
        <div class="value success" id="todayNetProfit">Rs. 0.00</div>
      </div>
      <div class="stat">
        <div class="label">Outstanding</div>
        <div class="value danger" id="totalOutstanding">Rs. 0.00</div>
      </div>
    </div>

    <div class="card">
      <h2 class="section-title">Shop Balances</h2>
      <div id="dashboardShopBalances" class="list"></div>
    </div>

  </section>

  <!-- Products -->
  <section class="page" id="products">
    <div class="card">
      <h2 class="section-title">Add Product</h2>

      <label>Product Name</label>
      <input id="productName" placeholder="e.g. Chocolate Pudding">

      <label>Cost Price (Rs.)</label>
      <input id="productCost" type="number" min="0" step="0.01" placeholder="60">

      <label>Sale Price (Rs.)</label>
      <input id="productPrice" type="number" min="0" step="0.01" placeholder="100">

      <button class="btn btn-primary" onclick="addProduct()">Add Product</button>
    </div>

    <div class="card">
      <h2 class="section-title">Products</h2>
      <div id="productList" class="list"></div>
    </div>
  </section>

  <!-- Shops -->
  <section class="page" id="shops">
    <div class="card">
      <h2 class="section-title">Add Shop</h2>

      <label>Shop Name</label>
      <input id="shopName" placeholder="e.g. ABC Grocery">

      <label>Phone</label>
      <input id="shopPhone" type="tel" placeholder="07XXXXXXXX">

      <button class="btn btn-primary" onclick="addShop()">Add Shop</button>
    </div>

    <div class="card">
      <h2 class="section-title">Shop List</h2>
      <div id="shopList" class="list"></div>
    </div>
  </section>

  <!-- Payments -->
  <section class="page" id="payments">
    <div class="card">
      <h2 class="section-title">Add Payment</h2>

      <label>Shop</label>
      <select id="paymentShop" onchange="showSelectedShopBalance()"></select>

      <div class="balance-banner" style="margin-top:14px;">
        <div class="muted">Current Balance</div>
        <div class="amount danger" style="font-size:22px;" id="selectedShopBalance">Rs. 0.00</div>
      </div>

      <label>Payment Amount (Rs.)</label>
      <input id="paymentAmount" type="number" min="0" step="0.01" placeholder="0.00">

      <button class="btn btn-green" onclick="addPayment()">Save Payment</button>
    </div>

    <div class="card">
      <h2 class="section-title">Payment History</h2>
      <div id="paymentList" class="list"></div>
    </div>
  </section>


  <!-- Expenses -->
  <section class="page" id="expenses">
    <div class="card">
      <h2 class="section-title">Add Expense</h2>

      <label>Expense Type</label>
      <select id="expenseType">
        <option>Ingredients</option>
        <option>Packaging</option>
        <option>Transport</option>
        <option>Electricity / Gas</option>
        <option>Other</option>
      </select>

      <label>Description</label>
      <input id="expenseDescription" placeholder="e.g. Milk, cups, delivery fuel">

      <label>Amount (Rs.)</label>
      <input id="expenseAmount" type="number" min="0" step="0.01" placeholder="0.00">

      <button class="btn btn-red" onclick="addExpense()">Save Expense</button>
    </div>

    <div class="card">
      <h2 class="section-title">Expense History</h2>
      <div id="expenseList" class="list"></div>
    </div>
  </section>

  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="openPage('dashboard', this)"><b>🏠</b>Home</button>
    <button class="nav-btn" onclick="openPage('products', this)"><b>🍮</b>Products</button>
    <button class="nav-btn" onclick="openPage('shops', this)"><b>🏪</b>Shops</button>
    <button class="nav-btn" onclick="openPage('payments', this)"><b>💵</b>Payment</button>
    <button class="nav-btn" onclick="openPage('expenses', this)"><b>🧾</b>Expenses</button>
  </nav>
</div>

<script>
  const KEY = 'pudding_business_v1';

  let db = {
    products: [],
    shops: [],
    payments: [],
    expenses: []
  };

  function loadDB() {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      try { db = JSON.parse(saved); } catch (e) {}
    }
    db.products = (db.products || []).map(p => ({ ...p, cost: Number(p.cost || 0) }));
    db.shops = db.shops || [];
    db.payments = db.payments || [];
    db.expenses = db.expenses || [];
    refreshAll();
  }

  function saveDB() {
    localStorage.setItem(KEY, JSON.stringify(db));
    refreshAll();
  }

  function id() {
    return Date.now().toString() + Math.random().toString(16).slice(2);
  }

  function money(v) {
    return 'Rs. ' + Number(v || 0).toLocaleString('en-LK', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  function todayKey() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function dateTimeText(iso) {
    const d = new Date(iso);
    return d.toLocaleString('en-LK');
  }

  function getShop(id) {
    return db.shops.find(s => s.id === id);
  }

  function getProduct(id) {
    return db.products.find(p => p.id === id);
  }

  function shopBalance(shopId) {
    return 0;
  }

  function openPage(pageId, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');

    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    refreshAll();
  }

  function addProduct() {
    const name = document.getElementById('productName').value.trim();
    const cost = Number(document.getElementById('productCost').value);
    const price = Number(document.getElementById('productPrice').value);

    if (!name) return alert('Enter product name.');
    if (cost < 0 || Number.isNaN(cost)) return alert('Enter valid cost price.');
    if (!price || price <= 0) return alert('Enter sale price.');
    if (price < cost) {
      if (!confirm('Sale price is lower than cost price. Save anyway?')) return;
    }

    db.products.push({ id: id(), name, cost, price });
    document.getElementById('productName').value = '';
    document.getElementById('productCost').value = '';
    document.getElementById('productPrice').value = '';
    saveDB();
  }

  function addShop() {
    const name = document.getElementById('shopName').value.trim();
    const phone = document.getElementById('shopPhone').value.trim();

    if (!name) return alert('Enter shop name.');

    db.shops.push({ id: id(), name, phone });
    document.getElementById('shopName').value = '';
    document.getElementById('shopPhone').value = '';
    saveDB();
  }


  function addPayment() {
    const shopId = document.getElementById('paymentShop').value;
    const amount = Number(document.getElementById('paymentAmount').value);

    if (!shopId) return alert('Add/select a shop.');
    if (!amount || amount <= 0) return alert('Enter payment amount.');

    db.payments.unshift({
      id: id(),
      shopId,
      amount,
      date: new Date().toISOString(),
      day: todayKey()
    });

    document.getElementById('paymentAmount').value = '';
    saveDB();
    alert('Payment saved.');
  }


  function addExpense() {
    const type = document.getElementById('expenseType').value;
    const description = document.getElementById('expenseDescription').value.trim();
    const amount = Number(document.getElementById('expenseAmount').value);

    if (!amount || amount <= 0) return alert('Enter expense amount.');

    db.expenses.unshift({
      id: id(),
      type,
      description,
      amount,
      date: new Date().toISOString(),
      day: todayKey()
    });

    document.getElementById('expenseDescription').value = '';
    document.getElementById('expenseAmount').value = '';
    saveDB();
    alert('Expense saved.');
  }

  function deleteExpense(expenseId) {
    if (!confirm('Delete this expense?')) return;
    db.expenses = db.expenses.filter(e => e.id !== expenseId);
    saveDB();
  }

  function deleteProduct(productId) {
    if (!confirm('Delete this product?')) return;
    db.products = db.products.filter(p => p.id !== productId);
    saveDB();
  }

  function deleteShop(shopId) {
    const used = db.payments.some(p => p.shopId === shopId);
    if (used) return alert('This shop has payment records, so it cannot be deleted.');
    if (!confirm('Delete this shop?')) return;
    db.shops = db.shops.filter(s => s.id !== shopId);
    saveDB();
  }


  function deletePayment(paymentId) {
    if (!confirm('Delete this payment?')) return;
    db.payments = db.payments.filter(p => p.id !== paymentId);
    saveDB();
  }


  function showSelectedShopBalance() {
    const shopId = document.getElementById('paymentShop').value;
    document.getElementById('selectedShopBalance').textContent =
      shopId ? money(shopBalance(shopId)) : money(0);
  }

  function renderProducts() {
    const box = document.getElementById('productList');

    if (!db.products.length) {
      box.innerHTML = '<div class="empty">No products yet.</div>';
      return;
    }

    box.innerHTML = db.products.map(p => {
      const cost = Number(p.cost || 0);
      const profit = Number(p.price || 0) - cost;
      return `
        <div class="item">
          <div class="item-head">
            <div>
              <div class="item-title">${escapeHtml(p.name)}</div>
              <div class="muted">Cost: ${money(cost)}</div>
              <div class="muted">Sale: ${money(p.price)}</div>
            </div>
            <div style="text-align:right;">
              <div class="muted">Profit / Item</div>
              <div class="amount ${profit >= 0 ? 'success' : 'danger'}">${money(profit)}</div>
            </div>
          </div>
          <div class="mini-actions">
            <button class="mini-btn mini-delete" onclick="deleteProduct('${p.id}')">Delete</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderShops() {
    const box = document.getElementById('shopList');

    if (!db.shops.length) {
      box.innerHTML = '<div class="empty">No shops yet.</div>';
      return;
    }

    box.innerHTML = db.shops.map(s => {
      const bal = shopBalance(s.id);
      return `
        <div class="item">
          <div class="item-head">
            <div>
              <div class="item-title">${escapeHtml(s.name)}</div>
              <div class="muted">${escapeHtml(s.phone || 'No phone')}</div>
            </div>
            <div style="text-align:right;">
              <div class="muted">Balance</div>
              <div class="amount ${bal > 0 ? 'danger' : 'success'}">${money(bal)}</div>
            </div>
          </div>
          <div class="mini-actions">
            <button class="mini-btn mini-delete" onclick="deleteShop('${s.id}')">Delete</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderSelects() {
    const shopOptions = db.shops.length
      ? db.shops.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')
      : '<option value="">Add a shop first</option>';

document.getElementById('paymentShop').innerHTML = shopOptions;

showSelectedShopBalance();
  }


  function renderPayments() {
    const box = document.getElementById('paymentList');

    if (!db.payments.length) {
      box.innerHTML = '<div class="empty">No payment records yet.</div>';
      return;
    }

    box.innerHTML = db.payments.map(p => {
      const shop = getShop(p.shopId);
      return `
        <div class="item">
          <div class="item-head">
            <div>
              <div class="item-title">${escapeHtml(shop ? shop.name : 'Unknown Shop')}</div>
              <span class="pill">${dateTimeText(p.date)}</span>
            </div>
            <div class="amount success">${money(p.amount)}</div>
          </div>
          <div class="mini-actions">
            <button class="mini-btn mini-delete" onclick="deletePayment('${p.id}')">Delete</button>
          </div>
        </div>
      `;
    }).join('');
  }


  function renderExpenses() {
    const box = document.getElementById('expenseList');
    if (!box) return;

    if (!db.expenses.length) {
      box.innerHTML = '<div class="empty">No expenses yet.</div>';
      return;
    }

    box.innerHTML = db.expenses.map(e => `
      <div class="item">
        <div class="item-head">
          <div>
            <div class="item-title">${escapeHtml(e.type)}</div>
            <div class="muted">${escapeHtml(e.description || '')}</div>
            <span class="pill">${dateTimeText(e.date)}</span>
          </div>
          <div class="amount danger">${money(e.amount)}</div>
        </div>
        <div class="mini-actions">
          <button class="mini-btn mini-delete" onclick="deleteExpense('${e.id}')">Delete</button>
        </div>
      </div>
    `).join('');
  }

  function renderDashboard() {
    const today = todayKey();

    const todayPayments = db.payments
      .filter(p => p.day === today)
      .reduce((sum, p) => sum + Number(p.amount), 0);

const todayExpenses = db.expenses
      .filter(e => e.day === today)
      .reduce((sum, e) => sum + Number(e.amount), 0);

    const todayNetProfit = todayPayments - todayExpenses;

    const totalOutstanding = 0;

document.getElementById('todayPayments').textContent = money(todayPayments);
document.getElementById('todayExpenses').textContent = money(todayExpenses);
    document.getElementById('todayNetProfit').textContent = money(todayNetProfit);
    const netEl = document.getElementById('todayNetProfit');
    netEl.className = 'value ' + (todayNetProfit >= 0 ? 'success' : 'danger');
    document.getElementById('totalOutstanding').textContent = money(totalOutstanding);

    const balanceBox = document.getElementById('dashboardShopBalances');
    const sortedShops = [...db.shops].sort((a,b) => shopBalance(b.id) - shopBalance(a.id));

    if (!sortedShops.length) {
      balanceBox.innerHTML = '<div class="empty">Add shops to see balances.</div>';
    } else {
      balanceBox.innerHTML = sortedShops.map(s => {
        const bal = shopBalance(s.id);
        return `
          <div class="item">
            <div class="item-head">
              <div>
                <div class="item-title">${escapeHtml(s.name)}</div>
                <div class="muted">${escapeHtml(s.phone || '')}</div>
              </div>
              <div class="amount ${bal > 0 ? 'danger' : 'success'}">${money(bal)}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    const recentBox = document.getElementById('recentDeliveries');
    const recent = db.deliveries.slice(0, 5);

    if (!recent.length) {
      recentBox.innerHTML = '<div class="empty">No recent deliveries.</div>';
    } else {
      recentBox.innerHTML = recent.map(d => {
        const shop = getShop(d.shopId);
        const product = getProduct(d.productId);
        return `
          <div class="item">
            <div class="item-head">
              <div>
                <div class="item-title">${escapeHtml(shop ? shop.name : 'Unknown Shop')}</div>
                <div class="muted">${escapeHtml(product ? product.name : 'Unknown Product')} × ${d.qty}</div>
              </div>
              <div class="amount">${money(d.total)}</div>
            </div>
          </div>
        `;
      }).join('');
    }
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function refreshAll() {
    renderProducts();
    renderShops();
    renderSelects();
    renderPayments();
    renderExpenses();
    renderDashboard();
  }

  loadDB();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
