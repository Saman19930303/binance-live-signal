<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b14">

<title>Binance Signal Engine V5</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#070b14;
    color:#eef4ff;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:16px;
}

.header{
    margin-bottom:16px;
}

.title{
    font-size:24px;
    font-weight:900;
    margin-bottom:5px;
}

.subtitle{
    color:#8fa2bd;
    font-size:13px;
}

.statusbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:14px;
    padding:12px 14px;
    background:#0d1422;
    border:1px solid #1d2a3e;
    border-radius:14px;
}

.live{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    font-weight:700;
}

.dot{
    width:9px;
    height:9px;
    background:#21d07a;
    border-radius:50%;
    box-shadow:0 0 10px #21d07a;
}

#countdown{
    color:#9eb0c9;
    font-size:12px;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:14px 0;
}

.summaryBox{
    background:#0d1422;
    border:1px solid #1d2a3e;
    border-radius:14px;
    padding:13px 8px;
    text-align:center;
}

.summaryValue{
    font-size:22px;
    font-weight:900;
}

.summaryLabel{
    margin-top:4px;
    font-size:11px;
    color:#8fa2bd;
}

.sectionTitle{
    margin:20px 0 10px;
    font-size:15px;
    font-weight:800;
}

.signalCard{
    background:#0d1422;
    border:1px solid #1d2a3e;
    border-radius:18px;
    padding:16px;
    margin-bottom:13px;
}

.signalCard.BUY{
    border-left:5px solid #22c77a;
}

.signalCard.SELL{
    border-left:5px solid #ff5964;
}

.signalCard.WAIT{
    border-left:5px solid #f0b90b;
}

.cardTop{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.symbol{
    font-size:20px;
    font-weight:900;
}

.price{
    color:#9eb0c9;
    font-size:12px;
    margin-top:4px;
}

.badge{
    padding:8px 13px;
    border-radius:999px;
    font-weight:900;
    font-size:13px;
}

.badge.BUY{
    color:#22c77a;
    background:rgba(34,199,122,.12);
}

.badge.SELL{
    color:#ff6570;
    background:rgba(255,89,100,.12);
}

.badge.WAIT{
    color:#f0b90b;
    background:rgba(240,185,11,.12);
}

.strengthRow{
    display:flex;
    justify-content:space-between;
    margin-top:16px;
    font-size:12px;
}

.bar{
    height:8px;
    background:#192438;
    border-radius:999px;
    overflow:hidden;
    margin-top:7px;
}

.fill{
    height:100%;
    background:#eef4ff;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:15px;
}

.metric{
    background:#111a2a;
    border:1px solid #1b2940;
    padding:10px;
    border-radius:12px;
}

.label{
    color:#8496af;
    font-size:10px;
}

.value{
    margin-top:5px;
    font-weight:800;
    font-size:13px;
    overflow-wrap:anywhere;
}

.trendGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:8px;
}

.confirmations{
    margin-top:14px;
}

.confirmTitle{
    font-size:11px;
    color:#8fa2bd;
    margin-bottom:7px;
}

.confirm{
    display:inline-block;
    padding:5px 8px;
    border-radius:8px;
    margin:2px;
    font-size:10px;
}

.bull{
    background:rgba(34,199,122,.12);
    color:#40dd94;
}

.bear{
    background:rgba(255,89,100,.12);
    color:#ff7780;
}

.warning{
    margin-top:12px;
    color:#7f91aa;
    font-size:10px;
    line-height:1.5;
}

.controls{
    display:flex;
    gap:8px;
    margin:12px 0;
}

button{
    flex:1;
    border:0;
    border-radius:12px;
    padding:12px;
    background:#f0b90b;
    color:#111;
    font-weight:900;
    cursor:pointer;
}

.secondary{
    background:#172238;
    color:#e8eef7;
}

.error{
    background:#35151a;
    border:1px solid #713039;
    color:#ffadb3;
    padding:14px;
    border-radius:12px;
    margin-top:12px;
}

.empty{
    padding:25px 10px;
    text-align:center;
    color:#8193ac;
}

.footer{
    text-align:center;
    padding:25px 5px;
    color:#65758d;
    font-size:10px;
}

@media(max-width:520px){

    .container{
        padding:12px;
    }

    .title{
        font-size:21px;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .trendGrid{
        grid-template-columns:repeat(3,1fr);
    }
}
</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="title">
Binance Signal Engine V5
</div>

<div class="subtitle">
1m Entry • 5m Confirmation • Closed Candle Analysis
</div>

<div class="statusbar">

<div class="live">
<span class="dot"></span>
<span id="status">Connecting...</span>
</div>

<div id="countdown">
Refresh --
</div>

</div>

</div>


<div class="summary">

<div class="summaryBox">
<div class="summaryValue" id="pairs">--</div>
<div class="summaryLabel">PAIRS CHECKED</div>
</div>

<div class="summaryBox">
<div class="summaryValue" id="found">--</div>
<div class="summaryLabel">SIGNALS FOUND</div>
</div>

<div class="summaryBox">
<div class="summaryValue" id="strongest">--</div>
<div class="summaryLabel">TOP STRENGTH</div>
</div>

</div>


<div class="controls">

<button onclick="loadSignals()">
SCAN NOW
</button>

<button
class="secondary"
onclick="toggleAll()">
SHOW / HIDE ALL
</button>

</div>


<div class="sectionTitle">
🔥 Actionable Signals
</div>

<div id="signals">
<div class="empty">
Loading signals...
</div>
</div>


<div id="allSection">

<div class="sectionTitle">
Market Scanner
</div>

<div id="allResults"></div>

</div>


<div class="footer">

Signal strength represents indicator confirmation,
not guaranteed win probability.

</div>

</div>


<script>

const API_BASE =
"https://binance-signal-engine.samanksirimanna.workers.dev";

const SCAN_URL =
API_BASE + "/scan";

let seconds = 30;

let showAll = true;

let loading = false;


function safeNumber(value,digits=4){

    const n = Number(value);

    if(!Number.isFinite(n)){
        return "--";
    }

    return n.toLocaleString(
        undefined,
        {
            maximumFractionDigits:digits
        }
    );
}


function priceFormat(value){

    const n = Number(value);

    if(!Number.isFinite(n)){
        return "--";
    }

    if(n >= 1000){
        return n.toLocaleString(
            undefined,
            {
                maximumFractionDigits:2
            }
        );
    }

    if(n >= 1){
        return n.toFixed(4)
            .replace(/0+$/,"")
            .replace(/\.$/,"");
    }

    return n.toFixed(8)
        .replace(/0+$/,"")
        .replace(/\.$/,"");
}


function text(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){
        return "--";
    }

    return String(value);
}


function confirmationHTML(items,type){

    if(!Array.isArray(items) || !items.length){
        return "";
    }

    return items.map(item =>
        `<span class="confirm ${type}">
            ${escapeHTML(item)}
        </span>`
    ).join("");
}


function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function card(result){

    const signal =
        ["BUY","SELL","WAIT"].includes(result.signal)
        ? result.signal
        : "WAIT";

    const strength =
        Number(result.signalStrength) || 0;

    const trade =
        result.trade || {};

    const trend =
        result.trend || {};

    const indicators =
        result.indicators || {};

    const confirmations =
        result.confirmations || {};

    return `

<div class="signalCard ${signal}">

<div class="cardTop">

<div>
<div class="symbol">
${escapeHTML(result.symbol || "--")}
</div>

<div class="price">
Price: ${priceFormat(result.price)}
</div>
</div>

<div class="badge ${signal}">
${signal}
</div>

</div>


<div class="strengthRow">

<span>
Signal Strength
</span>

<strong>
${strength}%
</strong>

</div>

<div class="bar">
<div
class="fill"
style="width:${Math.min(100,Math.max(0,strength))}%">
</div>
</div>


<div class="grid">

<div class="metric">
<div class="label">ENTRY</div>
<div class="value">
${priceFormat(trade.entry)}
</div>
</div>

<div class="metric">
<div class="label">TAKE PROFIT</div>
<div class="value">
${priceFormat(trade.tp)}
</div>
</div>

<div class="metric">
<div class="label">STOP LOSS</div>
<div class="value">
${priceFormat(trade.sl)}
</div>
</div>

<div class="metric">
<div class="label">RSI 1M</div>
<div class="value">
${safeNumber(indicators.rsi1m,2)}
</div>
</div>

<div class="metric">
<div class="label">RSI 5M</div>
<div class="value">
${safeNumber(indicators.rsi5m,2)}
</div>
</div>

<div class="metric">
<div class="label">VOLUME</div>
<div class="value">
${safeNumber(
    indicators.closedCandleVolumeRatio,
    2
)}x
</div>
</div>

<div class="metric">
<div class="label">SUPPORT</div>
<div class="value">
${priceFormat(indicators.support)}
</div>
</div>

<div class="metric">
<div class="label">RESISTANCE</div>
<div class="value">
${priceFormat(indicators.resistance)}
</div>
</div>

<div class="metric">
<div class="label">ATR 14</div>
<div class="value">
${priceFormat(indicators.atr14)}
</div>
</div>

</div>


<div class="trendGrid">

<div class="metric">
<div class="label">1M TREND</div>
<div class="value">
${escapeHTML(text(trend.oneMinute))}
</div>
</div>

<div class="metric">
<div class="label">5M TREND</div>
<div class="value">
${escapeHTML(text(trend.fiveMinute))}
</div>
</div>

<div class="metric">
<div class="label">MAIN TREND</div>
<div class="value">
${escapeHTML(text(trend.main))}
</div>
</div>

</div>


<div class="confirmations">

<div class="confirmTitle">
Bullish confirmations
</div>

${confirmationHTML(
    confirmations.bullish,
    "bull"
)}

<div
class="confirmTitle"
style="margin-top:9px">
Bearish confirmations
</div>

${confirmationHTML(
    confirmations.bearish,
    "bear"
)}

</div>


<div class="warning">

Market structure:
<strong>
${escapeHTML(
    text(trend.marketStructure)
)}
</strong>

<br>

${escapeHTML(
    result.strengthMeaning ||
    "Indicator confirmation strength, not win probability"
)}

</div>

</div>

`;
}


async function loadSignals(){

    if(loading){
        return;
    }

    loading = true;

    const status =
        document.getElementById("status");

    status.textContent =
        "Scanning market...";

    try{

        const response =
            await fetch(
                SCAN_URL +
                "?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );
        }

        const data =
            await response.json();

        if(!data.ok){

            throw new Error(
                data.error ||
                "Scanner returned an error"
            );
        }


        const signals =
            Array.isArray(data.signals)
            ? data.signals
            : [];

        const all =
            Array.isArray(data.allResults)
            ? data.allResults
            : [];


        document.getElementById("pairs")
            .textContent =
            data.pairsChecked ??
            all.length;


        document.getElementById("found")
            .textContent =
            data.signalsFound ??
            signals.length;


        const strongest =
            signals.length
            ? Math.max(
                ...signals.map(
                    x =>
                    Number(
                        x.signalStrength
                    ) || 0
                )
            )
            : 0;


        document.getElementById("strongest")
            .textContent =
            strongest
            ? strongest + "%"
            : "--";


        const signalBox =
            document.getElementById("signals");


        if(signals.length){

            signalBox.innerHTML =
                signals
                .sort(
                    (a,b) =>
                    (b.signalStrength || 0) -
                    (a.signalStrength || 0)
                )
                .map(card)
                .join("");

        }else{

            signalBox.innerHTML =
                `<div class="empty">
                No high-confidence BUY/SELL signal right now.
                </div>`;
        }


        document.getElementById("allResults")
            .innerHTML =
            all.length
            ? all
                .sort(
                    (a,b) =>
                    (b.signalStrength || 0) -
                    (a.signalStrength || 0)
                )
                .map(card)
                .join("")
            : `<div class="empty">
                No market data available.
               </div>`;


        status.textContent =
            "LIVE • " +
            new Date()
                .toLocaleTimeString();


        seconds = 30;

    }
    catch(error){

        status.textContent =
            "Connection Error";

        document.getElementById("signals")
            .innerHTML =
            `<div class="error">
                ${escapeHTML(
                    error.message
                )}
             </div>`;

    }
    finally{

        loading = false;
    }
}


function toggleAll(){

    showAll = !showAll;

    document.getElementById("allSection")
        .style.display =
        showAll
        ? "block"
        : "none";
}


setInterval(
    () => {

        seconds--;

        if(seconds <= 0){

            seconds = 30;

            loadSignals();
        }

        document.getElementById("countdown")
            .textContent =
            "Refresh " +
            seconds +
            "s";

    },
    1000
);


loadSignals();

</script>

</body>
</html>
